<aegisone_config>
  <global>
    <domain>aegisone.local</domain>
    <organization>Medicaps University Lab SOC</organization>
    <logall>yes</logall>
    <logall_json>yes</logall_json>
    <archive_compression>gzip</archive_compression>
    <retention_days>90</retention_days>
    <jsonout_output>yes</jsonout_output>
  </global>

  <ingestion_gateway>
    <port>3000</port>
    <protocol>https</protocol>
    <worker_pool_size>4</worker_pool_size>
    <bounded_queue_max>2048</bounded_queue_max>
    <require_collector_token>no</require_collector_token>
  </ingestion_gateway>

  <ml_engine>
    <algorithm>IsolationForest</algorithm>
    <num_trees>64</num_trees>
    <subsample_size>256</subsample_size>
    <anomaly_threshold>0.65</anomaly_threshold>
    <auto_correlate_incidents>yes</auto_correlate_incidents>
  </ml_engine>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <local_decoder_dir>etc/decoders</local_decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <local_rule_dir>etc/rules</local_rule_dir>
  </ruleset>
</aegisone_config>
